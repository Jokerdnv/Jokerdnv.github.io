<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Floorball Tournament Manager</title>
<style>
:root{--bg:#0b1220;--card:#151e30;--c2:#202c45;--tx:#f1f5f9;--mut:#94a3b8;--acc:#22d3ee;--ln:#ffffff18;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef2f7;--card:#fff;--c2:#e2e8f0;--tx:#0f172a;--mut:#64748b;--acc:#0891b2;--ln:#0f172a1a;color-scheme:light}}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
main{max-width:520px;margin:0 auto;padding:16px 14px calc(190px + env(safe-area-inset-bottom,0px))}
h1{font-size:20px;margin:0 0 14px;letter-spacing:.3px}h1 span{color:var(--acc)}
h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);margin:22px 0 10px}h2 small{font-weight:400}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .1s,opacity .2s,background .2s}
button:active{transform:scale(.95)}button:disabled{opacity:.4}
.b{background:var(--c2);border-radius:14px;min-height:52px;padding:0 16px;font-weight:700}
.b.p{background:var(--acc);color:#04202a}.b.d{background:#ef444433;color:#f87171}
.row{display:flex;gap:10px}.row>*{flex:1}.col{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:20px;padding:14px;margin-bottom:12px;border:1px solid var(--ln);animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.tc{border-radius:20px;padding:14px;margin-bottom:12px;animation:in .25s}
.ti{width:100%;font:800 20px inherit;font-family:inherit;color:inherit;background:#0003;border:0;border-radius:12px;padding:12px;min-height:52px}
.sw{display:flex;gap:10px;margin:12px 0 4px;flex-wrap:wrap;align-items:center}
.s{width:38px;height:38px;border-radius:50%;border:3px solid transparent;padding:0}.s.on{border-color:currentColor;box-shadow:0 0 0 2px #0006}
.pk{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);position:relative;overflow:hidden;display:block}.pk input{opacity:0;position:absolute;inset:0;width:100%;height:100%}
.x{background:#0003;border-radius:10px;min-height:40px;padding:0 12px;margin-top:8px;font-weight:600}
.fmt{display:flex;gap:10px}.fmt button{flex:1;background:var(--card);border:2px solid var(--ln);border-radius:18px;padding:14px 8px;text-align:center}
.fmt button.on{border-color:var(--acc);background:var(--c2)}.fmt b{display:block;font-size:17px}.fmt small{color:var(--mut)}
.chip{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;color:#0b1220}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c2);flex:none}
.mut{color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:40px 10px}
.sb{display:flex;gap:10px;margin-bottom:12px}.side{flex:1;border-radius:22px;padding:14px 10px;text-align:center;animation:in .25s;display:flex;flex-direction:column;gap:8px}
.sn{font-weight:800;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font:900 84px/1 system-ui;font-variant-numeric:tabular-nums}
.big{background:#0004;border:2px solid currentColor;border-radius:16px;min-height:76px;font:900 30px system-ui;color:inherit}
.sm{background:#0003;border-radius:12px;min-height:46px;font-weight:700;color:inherit}
.tm{text-align:center}.tm .td{font:800 64px/1.1 ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.mr{display:flex;align-items:center;gap:10px;padding:6px 0}.mn{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms{font:800 26px system-ui;min-width:34px;text-align:center}.r{width:48px;height:48px;border-radius:14px;background:var(--c2);font-size:24px;font-weight:800}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:4px}.mh .l{flex:1;font-size:13px;color:var(--mut);font-weight:600}
.mv{width:40px;height:34px;border-radius:10px;background:var(--c2)}
.rk{display:flex;align-items:center;gap:12px;border-left:8px solid;padding-left:12px}
.pos{font:800 22px system-ui;width:26px;color:var(--mut)}.pts{font:900 30px system-ui;text-align:right}.pts small{display:block;font-size:11px;color:var(--mut);font-weight:600}
.st{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin-top:10px;font-weight:700}.st small{display:block;color:var(--mut);font-size:11px;font-weight:600}
.win{font-weight:900}.lose{opacity:.55}
.champ{text-align:center;border-radius:20px;padding:20px;margin-bottom:14px;font-size:20px;font-weight:900}
.dock{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--ln);box-shadow:0 -8px 30px #0005;z-index:5}
.bar{display:flex;gap:8px;padding:8px 10px;align-items:center}
.tb{flex:1;background:var(--c2);border-radius:14px;min-height:52px;display:flex;align-items:center;justify-content:center;gap:10px}
.tb .td{font:800 28px ui-monospace,Menlo,monospace}.tb small{color:var(--mut)}
.bar .b{min-width:96px;padding:0 10px}.bar .b.r2{min-width:52px}
.sheet{display:none;padding:14px;border-bottom:1px solid var(--ln)}.sheet.open{display:block;animation:in .2s}
.sheet .td{font:800 72px/1.1 ui-monospace,Menlo,monospace;text-align:center;margin:6px 0 10px}
.seg{display:flex;background:var(--c2);border-radius:14px;padding:4px;margin-bottom:6px}.seg button{flex:1;min-height:44px;border-radius:11px;background:none;font-weight:700}.seg .on{background:var(--acc);color:#04202a}
.dc{display:flex;gap:8px;margin-top:10px}.dc .b{min-height:46px;padding:0;font-size:14px}.dc .on{background:var(--acc);color:#04202a}
nav{display:flex;padding:0 6px 6px}nav button{flex:1;background:none;min-height:56px;border-radius:14px;color:var(--mut);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button i{font-style:normal;font-size:21px}nav .on{color:var(--acc);background:var(--c2)}
#toast{position:fixed;left:50%;bottom:calc(170px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.flash .bar{animation:fl .5s 4}@keyframes fl{50%{background:#ef4444}}
</style></head><body>
<main id="app"></main>
<div class="dock">
 <div id="sheet" class="sheet"></div>
 <div class="bar"><button class="tb" data-a="topen" aria-label="Open timer"><span class="td">05:00</span><small id="tmode"></small></button><button class="b p tp" data-a="tt">▶ Start</button><button class="b r2" data-a="tr" aria-label="Reset timer">↺</button></div>
 <nav id="nav"></nav>
</div>
<div id="toast"></div>
<script>
const COLORS=['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#06b6d4'];
const ST={todo:['Upcoming','#94a3b8'],live:['In progress','#f59e0b'],done:['Finished','#22c55e']};
const def=()=>({teams:[],fmt:'rr',matches:[],started:false,dur:300,cur:null,tab:'setup',tmode:'cd'});
let S=(()=>{try{return Object.assign(def(),JSON.parse(localStorage.getItem('ftm1'))||{})}catch(e){return def()}})();
const save=()=>{try{localStorage.setItem('ftm1',JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,8);
const T=id=>S.teams.find(t=>t.id===id),M=id=>S.matches.find(m=>m.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ink=h=>{const n=parseInt(h.slice(1),16);return ((n>>16)*299+((n>>8)&255)*587+(n&255)*114)/1000>150?'#0b1220':'#fff'};
const KO=()=>S.fmt==='ko';
/* ---------- match logic ---------- */
function res(src){if(src.t)return src.t;const m=M(src.m);if(!m||m.st!=='done')return null;const w=winner(m);if(!w)return null;return src.w?w:rt(m).find(x=>x!==w)}
const rt=m=>[res(m.a),res(m.b)];
function winner(m){const[a,b]=rt(m);return m.sa>m.sb?a:m.sb>m.sa?b:null}
function sync(){S.matches.forEach(m=>{const s=rt(m).join('|');if(m.sig!==s){if(m.sig!==undefined&&(m.st!=='todo'||m.sa||m.sb)){m.sa=m.sb=0;m.st='todo'}m.sig=s}})}
function gen(){const ids=S.teams.map(t=>t.id),L=[],mk=(a,b,l,r)=>({id:uid(),a,b,sa:0,sb:0,st:'todo',lbl:l,rnd:r}),t=i=>({t:ids[i]});
 if(!KO()){let q=[...ids];if(q.length%2)q.push(null);const n=q.length;for(let r=0;r<n-1;r++){for(let i=0;i<n/2;i++){const x=q[i],y=q[n-1-i];if(x&&y)L.push(mk({t:x},{t:y},'Round '+(r+1)))}q.splice(1,0,q.pop())}}
 else if(ids.length==2)L.push(mk(t(0),t(1),'Final','Final'));
 else if(ids.length==3){const s=mk(t(1),t(2),'Semi-final','Semi-finals');L.push(s,mk(t(0),{m:s.id,w:1},'Final','Final'))}
 else{const a=mk(t(0),t(3),'Semi-final 1','Semi-finals'),b=mk(t(1),t(2),'Semi-final 2','Semi-finals');L.push(a,b,mk({m:a.id,w:0},{m:b.id,w:0},'Third place','Third place'),mk({m:a.id,w:1},{m:b.id,w:1},'Final','Final'))}
 S.matches=L;S.cur=null;sync()}
function curM(){let m=M(S.cur);if(m)return m;m=S.matches.find(x=>x.st!=='done'&&rt(x).every(Boolean));return m||S.matches[S.matches.length-1]}
function table(){const r=S.teams.map(t=>({t,p:0,w:0,d:0,l:0,gf:0,ga:0}));
 S.matches.filter(m=>m.st==='done').forEach(m=>{const[a,b]=rt(m),A=r.find(x=>x.t.id===a),B=r.find(x=>x.t.id===b);A.p++;B.p++;A.gf+=m.sa;A.ga+=m.sb;B.gf+=m.sb;B.ga+=m.sa;if(m.sa>m.sb){A.w++;B.l++}else if(m.sa<m.sb){B.w++;A.l++}else{A.d++;B.d++}});
 r.forEach(x=>{x.pts=x.w*3+x.d;x.gd=x.gf-x.ga});return r.sort((x,y)=>y.pts-x.pts||y.gd-x.gd||y.gf-x.gf)}
/* ---------- timer ---------- */
const TM={run:false,el:0,t0:0,open:false};let AC;
const el=()=>TM.el+(TM.run?Date.now()-TM.t0:0),tot=()=>S.dur*1000;
function disp(){const cd=S.tmode==='cd',s=cd?Math.ceil(Math.max(0,tot()-el())/1000):Math.floor(el()/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}}
function beep(){try{unlock();[0,.4,.8].forEach(d=>{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+d;o.frequency.value=880;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.start(t);o.stop(t+.35)})}catch(e){}navigator.vibrate&&navigator.vibrate([300,100,300])}
function tStart(){if(S.tmode==='cd'&&el()>=tot())TM.el=0;TM.t0=Date.now();TM.run=true;unlock()}
function tPause(){TM.el=el();TM.run=false}
function tReset(){TM.run=false;TM.el=0}
setInterval(()=>{if(TM.run&&S.tmode==='cd'&&el()>=tot()){TM.run=false;TM.el=tot();beep();toast('Time’s up!');document.body.classList.add('flash');setTimeout(()=>document.body.classList.remove('flash'),2200)}
 const d=disp();document.querySelectorAll('.td').forEach(n=>n.textContent=d);document.querySelectorAll('.tp').forEach(n=>n.textContent=TM.run?'⏸ Pause':'▶ Start')},250);
const fm=s=>Math.floor(s/60)+'m'+(s%60?' '+s%60+'s':'');
function durCtl(){return `<div class="dc"><button class="b" data-a="dur" data-v="-60">−1m</button><button class="b" data-a="dur" data-v="-10">−10s</button><button class="b p" disabled style="opacity:1">${fm(S.dur)}</button><button class="b" data-a="dur" data-v="10">+10s</button><button class="b" data-a="dur" data-v="60">+1m</button></div><div class="dc">${[180,300,480,600].map(v=>`<button class="b ${S.dur==v?'on':''}" data-a="durset" data-v="${v}">${v/60} min</button>`).join('')}</div>`}
function renderSheet(){const sh=document.getElementById('sheet');sh.className='sheet'+(TM.open?' open':'');
 sh.innerHTML=`<div class="seg"><button class="${S.tmode==='cd'?'on':''}" data-a="tmode" data-v="cd">Countdown</button><button class="${S.tmode==='sw'?'on':''}" data-a="tmode" data-v="sw">Stopwatch</button></div><div class="td">${disp()}</div><div class="row"><button class="b p tp" data-a="tt" style="min-height:64px;font-size:20px">▶ Start</button><button class="b" data-a="tr" style="min-height:64px;font-size:20px">↺ Reset</button></div>${S.tmode==='cd'?durCtl():''}<button class="b" style="width:100%;margin-top:10px;min-height:44px" data-a="topen">Close</button>`;
 document.getElementById('tmode').textContent=S.tmode==='cd'?'countdown':'stopwatch'}
/* ---------- views ---------- */
const dot=t=>`<span class="dot" style="background:${t.color}"></span>`;
const chip=m=>`<span class="chip" style="background:${ST[m.st][1]}">${ST[m.st][0]}</span>`;
const empty=(t)=>`<div class="empty"><div style="font-size:44px">🏑</div><p>${t}</p><button class="b p" data-a="tab" data-v="setup">Go to Setup</button></div>`;
function vSetup(){const n=S.teams.length,st=S.started;
 let h='<div class="row" style="align-items:center;margin-bottom:14px"><h1 style="margin:0;flex:1">🏑 Floorball <span>Tournament</span></h1><button class="b d" style="flex:none;min-height:44px" data-a="newt">↺ New</button></div>'+`<h2>Teams <small>${n}/4</small></h2>`;
 h+=S.teams.map(t=>`<div class="tc" style="background:${t.color};color:${ink(t.color)}"><input class="ti" data-id="${t.id}" value="${esc(t.name)}" maxlength="20" aria-label="Team name"><div class="sw">${COLORS.map(c=>`<button class="s${c==t.color?' on':''}" style="background:${c}" data-a="col" data-id="${t.id}" data-v="${c}" aria-label="Color ${c}"></button>`).join('')}<label class="s pk"><input type="color" class="cp" data-id="${t.id}" value="${t.color}" aria-label="Custom color"></label></div>${st?'':`<button class="x" data-a="del" data-id="${t.id}">✕ Remove team</button>`}</div>`).join('');
 if(!st&&n<4)h+='<button class="b p" style="width:100%" data-a="add">+ Add team</button>';
 if(!st)h+=`<h2>Format</h2><div class="fmt"><button class="${!KO()?'on':''}" data-a="fmt" data-v="rr"><b>🔁 Round Robin</b><small>Everyone vs everyone</small></button><button class="${KO()?'on':''}" data-a="fmt" data-v="ko"><b>🏆 Knockout</b><small>Bracket + final</small></button></div>`;
 h+=`<h2>Match duration</h2><div class="card">${durCtl()}</div>`;
 if(!st)h+=`<button class="b p" style="width:100%;min-height:62px;font-size:18px;margin-top:6px" data-a="gen" ${n<2?'disabled':''}>${n<2?'Add at least 2 teams':'▶ Start tournament'}</button>`;
 else h+=`<h2>Tournament</h2><div class="card"><b>${KO()?'Knockout':'Round Robin'}</b> · ${S.matches.length} matches · ${S.matches.filter(m=>m.st==='done').length} finished</div><div class="col"><button class="b" data-a="rst">↺ Reset results</button><button class="b" data-a="unstart">✎ Change teams / format</button></div>`;
 h+='<div class="col" style="margin-top:22px"><button class="b d" data-a="newt">↺ Reset everything &amp; start new tournament</button></div>';return h}
function vPlay(){if(!S.started)return empty('Create teams and start a tournament first.');
 const m=curM(),[a,b]=rt(m).map(id=>id&&T(id)),i=S.matches.indexOf(m);
 let h=`<div class="mh"><span class="l">${esc(m.lbl)} · ${i+1}/${S.matches.length}</span>${chip(m)}</div>`;
 if(!a||!b)h+=`<div class="card empty">Waiting for earlier matches to finish.</div>`;
 else{const side=(t,k)=>`<div class="side" style="background:${t.color};color:${ink(t.color)}"><div class="sn">${esc(t.name)}</div><div class="sc">${m[k]}</div><button class="big" data-a="g" data-m="${m.id}" data-k="${k}" data-d="1">+1 GOAL</button><button class="sm" data-a="g" data-m="${m.id}" data-k="${k}" data-d="-1">−1</button></div>`;
  h+=`<div class="sb">${side(a,'sa')}${side(b,'sb')}</div>`;
  if(m.st==='done'){const w=winner(m);h+=`<div class="card" style="text-align:center;font-weight:800">${w?'🏆 '+esc(T(w).name)+' wins':'🤝 Draw'}</div>`}}
 h+=`<div class="card tm"><div class="td">${disp()}</div><div class="row" style="margin-top:10px"><button class="b p tp" style="min-height:64px;font-size:20px" data-a="tt">▶ Start</button><button class="b" style="min-height:64px;font-size:20px" data-a="tr">↺ Reset</button></div></div>`;
 if(a&&b)h+=`<div class="row" style="margin-bottom:10px">${m.st==='live'?`<button class="b p" style="min-height:64px" data-a="fin" data-m="${m.id}">✔ Finish match</button>`:m.st==='todo'?`<button class="b p" style="min-height:64px" data-a="sm" data-m="${m.id}">▶ Start match</button>`:`<button class="b" style="min-height:64px" data-a="reopen" data-m="${m.id}">Reopen</button>`}<button class="b" style="min-height:64px" data-a="next">Next match →</button></div>`;
 else h+=`<button class="b" style="width:100%;margin-bottom:10px" data-a="next">Next match →</button>`;
 h+=`<div class="row"><button class="b" data-a="tab" data-v="table">${KO()?'🏆 Bracket':'📊 Standings'}</button><button class="b" data-a="tab" data-v="matches">☰ All matches</button></div>`;return h}
function mcard(m,i){const[a,b]=rt(m).map(id=>id&&T(id)),both=a&&b;
 const row=(t,k)=>t?`<div class="mr">${dot(t)}<span class="mn">${esc(t.name)}</span><button class="r" data-a="g" data-m="${m.id}" data-k="${k}" data-d="-1" aria-label="Minus goal">−</button><b class="ms" style="color:${t.color}">${m[k]}</b><button class="r" data-a="g" data-m="${m.id}" data-k="${k}" data-d="1" aria-label="Plus goal">+</button></div>`:`<div class="mr">${dot({color:''})}<span class="mn mut">To be decided</span></div>`;
 return `<div class="card"><div class="mh"><span class="l">${i+1}. ${esc(m.lbl)}</span>${!KO()&&m.st==='todo'?`<button class="mv" data-a="mv" data-m="${m.id}" data-d="-1" aria-label="Move up">▲</button><button class="mv" data-a="mv" data-m="${m.id}" data-d="1" aria-label="Move down">▼</button>`:''}${chip(m)}</div>${row(a,'sa')}${row(b,'sb')}${both?`<div class="row" style="margin-top:8px"><button class="b" data-a="open" data-m="${m.id}">Open in Play</button>${m.st==='live'?`<button class="b p" data-a="fin" data-m="${m.id}">Finish</button>`:m.st==='todo'?`<button class="b p" data-a="sm" data-m="${m.id}">Start</button>`:`<button class="b" data-a="reopen" data-m="${m.id}">Reopen</button>`}</div>`:''}</div>`}
function vMatches(){if(!S.started)return empty('No matches yet.');return '<h1>Matches</h1>'+S.matches.map(mcard).join('')}
function vTable(){if(!S.started)return empty('No tournament yet.');
 if(KO()){const f=S.matches.find(m=>m.lbl==='Final'),w=f&&f.st==='done'&&winner(f),th=S.matches.find(m=>m.lbl==='Third place');
  let h='<h1>Bracket</h1>';if(w){const t=T(w);h+=`<div class="champ" style="background:${t.color};color:${ink(t.color)}">🏆 Champion<br>${esc(t.name)}</div>`}
  ['Semi-finals','Final','Third place'].forEach(r=>{const ms=S.matches.filter(m=>m.rnd===r);if(!ms.length)return;h+=`<h2>${r}</h2>`+ms.map(m=>{const wn=m.st==='done'&&winner(m),[a,b]=rt(m);const rw=(id,k)=>{const t=id&&T(id);return `<div class="mr ${wn?(wn===id?'win':'lose'):''}">${t?dot(t)+`<span class="mn">${esc(t.name)}</span>`:`<span class="dot"></span><span class="mn mut">TBD</span>`}<b class="ms">${t?m[k]:'–'}</b></div>`};return `<div class="card" data-a="open" data-m="${m.id}" style="cursor:pointer"><div class="mh"><span class="l">${esc(m.lbl)}</span>${chip(m)}</div>${rw(a,'sa')}${rw(b,'sb')}</div>`}).join('')});return h}
 return '<h1>Standings</h1>'+table().map((r,i)=>`<div class="card rk" style="border-left-color:${r.t.color}"><div style="flex:1"><div class="row" style="align-items:center;gap:8px"><span class="pos">${i+1}</span><b style="flex:1;font-size:18px">${esc(r.t.name)}</b><div class="pts" style="flex:none">${r.pts}<small>PTS</small></div></div><div class="st">${[['P',r.p],['W',r.w],['D',r.d],['L',r.l],['GF',r.gf],['GA',r.ga],['GD',(r.gd>0?'+':'')+r.gd]].map(([k,v])=>`<div>${v}<small>${k}</small></div>`).join('')}</div></div></div>`).join('')+'<p class="mut" style="text-align:center;font-size:13px">Win 3 · Draw 1 · Loss 0 — sorted by points, goal difference, goals scored</p>'}
function render(){const v={setup:vSetup,play:vPlay,matches:vMatches,table:vTable}[S.tab]||vSetup;
 const y=scrollY;document.getElementById('app').innerHTML=v();
 document.getElementById('nav').innerHTML=[['setup','⚙','Setup'],['play','▶','Play'],['matches','☰','Matches'],['table','🏆',KO()?'Bracket':'Table']].map(([k,i,l])=>`<button class="${S.tab===k?'on':''}" data-a="tab" data-v="${k}"><i>${i}</i>${l}</button>`).join('');
 renderSheet();scrollTo(0,y)}
let tt;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}
/* ---------- actions ---------- */
let PEND={k:'',t:0};function ask(k,msg){if(PEND.k===k&&Date.now()-PEND.t<4000){PEND.k='';return true}PEND={k,t:Date.now()};toast(msg+' – tap again to confirm');return false}
function act(d){const m=d.m&&M(d.m);
 switch(d.a){
 case 'tab':S.tab=d.v;scrollTo(0,0);break;
 case 'add':if(S.teams.length<4){const c=COLORS.find(c=>!S.teams.some(t=>t.color===c))||COLORS[0];S.teams.push({id:uid(),name:'Team '+(S.teams.length+1),color:c})}break;
 case 'del':S.teams=S.teams.filter(t=>t.id!==d.id);break;
 case 'col':T(d.id).color=d.v;break;
 case 'fmt':S.fmt=d.v;break;
 case 'gen':if(S.teams.length<2)break;gen();S.started=true;S.tab='play';tReset();break;
 case 'rst':if(ask('rst','Reset all results')){gen();tReset();toast('Results reset')}break;
 case 'unstart':if(ask('unstart','Results will be lost')){S.started=false;S.matches=[];S.cur=null;tReset();toast('You can now edit teams and format')}break;
 case 'newt':if(ask('newt','Everything will be deleted')){S=def();S.teams=[{id:uid(),name:'Team 1',color:COLORS[0]},{id:uid(),name:'Team 2',color:COLORS[1]}];tReset();TM.open=false;toast('Everything reset')}break;
 case 'g':{if(!rt(m).every(Boolean))break;const v=m[d.k]+ +d.d;if(v<0)break;m[d.k]=v;if(m.st==='todo')m.st='live';if(m.st==='done'&&KO()&&m.sa===m.sb)m.st='live';navigator.vibrate&&navigator.vibrate(20);break}
 case 'sm':m.st='live';S.cur=m.id;tReset();tStart();break;
 case 'fin':if(KO()&&m.sa===m.sb){toast('Knockout needs a winner – add a goal');break}m.st='done';S.cur=m.id;tPause();{const w=winner(m);toast(w?T(w).name+' wins!':'Draw – match finished')}break;
 case 'reopen':m.st='live';break;
 case 'open':S.cur=m.id;S.tab='play';scrollTo(0,0);break;
 case 'next':{const c=curM(),i=S.matches.indexOf(c),o=[...S.matches.slice(i+1),...S.matches.slice(0,i)],n=o.find(x=>x.st!=='done'&&rt(x).every(Boolean));if(n){S.cur=n.id;tReset()}else toast('No more matches to play');break}
 case 'mv':{const i=S.matches.indexOf(m),j=i+ +d.d;if(j>=0&&j<S.matches.length)[S.matches[i],S.matches[j]]=[S.matches[j],S.matches[i]];break}
 case 'dur':S.dur=Math.max(10,Math.min(5940,S.dur+ +d.v));break;
 case 'durset':S.dur=+d.v;break;
 case 'tt':TM.run?tPause():tStart();break;
 case 'tr':tReset();break;
 case 'tmode':S.tmode=d.v;tReset();break;
 case 'topen':TM.open=!TM.open;break}
 sync();save();render()}
document.addEventListener('click',e=>{const n=e.target.closest('[data-a]');if(n)act(n.dataset)});
document.addEventListener('input',e=>{const n=e.target,t=n.dataset.id&&T(n.dataset.id);if(!t)return;if(n.classList.contains('ti')){t.name=n.value||'Team';save()}else if(n.classList.contains('cp')){t.color=n.value;n.closest('.tc').style.background=t.color;n.closest('.tc').style.color=ink(t.color);save()}});
document.addEventListener('change',e=>{if(e.target.classList.contains('cp'))render()});
if(!S.teams.length){S.teams=[{id:uid(),name:'Team 1',color:COLORS[0]},{id:uid(),name:'Team 2',color:COLORS[1]}]}
sync();render();
</script></body></html>
